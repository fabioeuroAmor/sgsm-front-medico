          - generic [ref=f26e1700]:
            - paragraph [ref=f26e1701]: Gostaria de entender melhor como funciona o sistema de agendamento de consultas para pacientes com atendimento domiciliar, incluindo quais são os critérios utilizados para definir a disponibilidade de horários dos médicos, como o sistema calcula os valores cobrados quando há deslocamento até a residência do paciente, e também gostaria de saber se existe algum tipo de relatório consolidado que mostre o histórico de agendamentos cancelados por médico, por período e por motivo, para que eu possa acompanhar melhor a operação e identificar possíveis gargalos no processo de atendimento ao longo dos últimos meses.
            - paragraph [ref=f26e1702]: 11:40
          - generic [ref=f26e1712]:
            - paragraph [ref=f26e1713]: "**Como funciona o agendamento de consultas domiciliares no SGSM (com base nos dados disponíveis):** 1. **Tipos de atendimento** - Nos registros há consultas marcadas com o campo **`Tipo: DOMICILIAR`** (ex.: João Pereira Teste – 27/08/2026, 08:00 e 08:30; Zildinha Ruela – 20/08/2026, 09:00). - O tipo “DOMICILIAR” indica que o médico irá até a residência do paciente. 2. **Critérios de disponibilidade de horário** - O sistema controla a ocupação da agenda por **slots** (faixas de horário). - Para o médico **Fabio Monteiro Amorim** (Neurologia) temos: - `slots_totais: 10` - `slots_usados: 9` - `taxa_ocupacao_pct: 90,00%` - Quando o número de slots usados se aproxima do total, o sistema considera a agenda quase cheia e, consequentemente, reduz a disponibilidade de novos horários. - Não há no contexto informações adicionais sobre regras específicas (ex.: distância máxima, tempo de deslocamento, limites diários) que o SGSM utiliza para definir quais horários podem ser ofertados como domiciliares. 3. **Cálculo de valores cobrados pelo deslocamento** - O campo **Faturamento mensal** está registrado como “sem dados disponíveis no momento”. - Não há nos registros nenhum detalhe sobre como o sistema calcula valores adicionais por deslocamento até a residência do paciente (ex.: tarifa fixa, quilometragem, tempo de viagem, etc.). - Portanto, com base nas informações fornecidas, **não é possível informar** o método de cálculo dos valores cobrados para atendimentos domiciliares. 4. **Relatório consolidado de cancelamentos** - Existe um **Histórico de cancelamentos** resumido: - `origem_cancelamento: MEDICO` - `mes: 2026-08-01` - `total_cancelamentos: 1` - `pacientes_distintos: 1` - `medicos_distintos: 1` - Esse resumo indica apenas o número total de cancelamentos por origem (medico) e por mês, sem detalhar motivo, data exata ou lista de pacientes. - Não há nos dados um relatório mais detalhado que mostre, por exemplo, **cancelamentos por médico, por período e por motivo**. **Resumo:** - O SGSM registra consultas domiciliares como um tipo de atendimento e controla a disponibilidade por meio de slots de agenda (ex.: 10 slots, 9 usados para o Dr. Fabio Monteiro Amorim). - Não há informações no contexto sobre os critérios específicos de definição de horários domiciliares nem sobre a fórmula de cobrança de deslocamento. - Existe apenas um resumo mensal de cancelamentos por origem; não há um relatório consolidado com detalhes por médico, período e motivo. Caso precise de informações mais detalhadas (ex.: regras de alocação de slots, política de tarifação de deslocamento ou relatórios avançados de cancelamento), será necessário consultar a documentação técnica ou a equipe responsável pelo módulo de agendamento do SGSM."
