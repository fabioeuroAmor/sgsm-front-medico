server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mesmo roteamento do proxy de dev (vite.config.ts): host.docker.internal
    # aponta para os backends publicados na maquina host pelos respectivos
    # containers (sgsm:8080, ms-sboot-auth:8081, sgsm-ia:8082).

    location /v1/api/auth/ {
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # So os subcaminhos reais da API — nao o prefixo /ia inteiro, que colidiria
    # com a rota SPA /ia em navegacao direta/reload.
    location ~ ^/ia/(chat|busca|paciente|kpis|etl) {
        proxy_pass http://host.docker.internal:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /crm/ {
        proxy_pass http://host.docker.internal:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer outra rota cai no index.html (react-router-dom cuida do resto)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
